name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  docker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Проверка файлов проекта
        run: ls -la

      - name: Сборка Docker-образа
        run: docker compose build

      - name: Запуск контейнеров
        run: docker compose up -d

      - name: Проверка запущенных контейнеров
        run: docker ps

      - name: Проверка ответа приложения
        run: |
          sleep 10
          curl -f http://localhost:8000

      - name: Остановка контейнеров
        run: docker compose down

      - name: Автоматический деплой через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull
            docker compose up -d --build
